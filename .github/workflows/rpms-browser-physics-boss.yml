name: RPMS Browser Real Rapier Boss Physics
on:
  push:
    paths:
      - 'viewer/rpms/boss*'
      - 'viewer/rpms/tests/boss-browser-physics.cjs'
      - 'viewer/rpms/tests/boss-multibody-browser.cjs'
      - 'viewer/rpms/index.html'
      - '.github/workflows/rpms-browser-physics-boss.yml'
  pull_request:
    paths:
      - 'viewer/rpms/boss*'
      - 'viewer/rpms/tests/boss-browser-physics.cjs'
      - 'viewer/rpms/tests/boss-multibody-browser.cjs'
      - 'viewer/rpms/index.html'
      - '.github/workflows/rpms-browser-physics-boss.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile JS and check source for NO anti-gravity shortcuts
        run: |
          node --check viewer/rpms/boss-physics.mjs
          node --check viewer/rpms/boss-multibody.mjs
          node --check viewer/rpms/boss-powertrain.mjs
          node --check viewer/rpms/tests/boss-powertrain.test.mjs
          node viewer/rpms/tests/boss-powertrain.test.mjs
          node --check viewer/rpms/tests/boss-multibody-browser.cjs
          node --check viewer/rpms/boss.js
          node --check viewer/rpms/tests/boss-browser-physics.cjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('viewer/rpms/boss-physics.mjs').read_text()
          assert 'new RAPIER.World' in s and 'world.step()' in s
          assert 'world.removeCollider' in s
          assert '.setTranslation(0,4.6,0)' in s
          assert 'body.setTranslation' not in s
          PY
      - name: Install Chrome automation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --prefix /tmp/rpms-boss-browser --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Real WASM physical four-foot stand and collapse, full-page screenshots
        env:
          NODE_PATH: /tmp/rpms-boss-browser/node_modules
        run: |
          python3 -m http.server 8033 --directory viewer >/tmp/rpms-boss-http.log 2>&1 &
          node viewer/rpms/tests/boss-browser-physics.cjs
          node viewer/rpms/tests/boss-multibody-browser.cjs
      - name: Upload REAL Chrome physics evidence (screenshots + run logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpms-boss-actual-rapier-standing-and-collapse
          path: |
            viewer/rpms/tests/boss-real-*.png
            viewer/rpms/tests/boss-articulated-*.png
            /tmp/rpms-boss-http.log
          if-no-files-found: ignore
          retention-days: 14

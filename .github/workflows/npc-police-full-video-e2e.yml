name: NPC POLICE real-client continuous footage / crime to jail
on:
  workflow_dispatch:
  push:
    branches:
      - feat/npc-crime-visual-replay-v072

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  camera-chase-actual-minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify real 1.21.1 NeoForge and Java version
        run: |
          grep -Fxq 'minecraft_version=1.21.1' mod/gradle.properties
          grep -Fxq 'neo_version=21.1.262' mod/gradle.properties
          grep -Fxq 'mod_version=0.7.1-dev' mod/gradle.properties
      - name: Install true Xvfb window server, control, MP4 codec
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool imagemagick openbox ffmpeg
      - name: Record ORIGINAL Minecraft pixels continuously, verify real case
        shell: bash
        env:
          REME_CITY_VISUAL: '0'
          REME_POLICE_FILM: '1'
          REME_COMMAND_SMOKE_ONLY: '0'
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=20s 730s \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            bash scripts/test-client-gui.sh
      - name: Upload full UNEDITED VIDEO and actual game logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-crime-real-minecraft-continuous-original-video
          if-no-files-found: warn
          retention-days: 30
          path: |
            mod/client-gui-police-full-process.mp4
            mod/client-gui-police-*.png
            mod/client-police-ffmpeg.log
            mod/client-gui.log
            mod/run/logs/*.log
            mod/runs/**/logs/*.log

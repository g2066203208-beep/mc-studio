name: Actual Minecraft client GUI screenshots (experimental)
on:
  workflow_dispatch:
  push:
    branches: [fix/npc-client-acceptance-v054]
permissions:
  contents: read
jobs:
  gui-client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install virtual display and mouse automation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool imagemagick openbox
      - name: Boot real NeoForge Minecraft CLIENT; photograph main menu and try UI
        run: |
          set +e
          timeout --signal=INT --kill-after=15s 370s             xvfb-run -a -s "-screen 0 1280x720x24"             bash scripts/test-client-gui.sh
          code=$?
          echo "UI script exit: $code"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Archive real client screenshots and logs for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-gui-screens-and-logs
          if-no-files-found: warn
          path: |
            mod/client-gui-*.png
            mod/client-gui.log
            mod/run/logs/*.log
            mod/runs/**/logs/*.log

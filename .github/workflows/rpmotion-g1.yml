name: RPMotion Genuine Aeronautics G1
on:
  push:
    paths:
      - 'mods/rpmotion/**'
      - '.github/workflows/rpmotion-g1.yml'
  pull_request:
    paths:
      - 'mods/rpmotion/**'
      - '.github/workflows/rpmotion-g1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpmotion-${ github.head_ref || github.ref_name }
  cancel-in-progress: true
jobs:
  real-aero:
    name: Original Aeronautics + Create + Sable, real NeoForge GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch REAL published Mod JARs from Modrinth; inspect and build system-only Mod
        run: bash mod/gradlew -p mods/rpmotion inspectInstalledMods build --no-daemon --console plain
      - name: Load official mod binaries and native SwivelBearing on the actual Sable server
        run: bash mod/gradlew -p mods/rpmotion runGameTestServer --no-daemon --console plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpmotion-g1-logs-${ github.sha }
          path: |
            mods/rpmotion/run/logs/*.log
            mods/rpmotion/run-gameTestServer/logs/*.log
            mods/rpmotion/build/test-results/test/*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rpmotion-system-only-${ github.sha }
          path: mods/rpmotion/build/libs/rpmotion-*.jar
          if-no-files-found: error

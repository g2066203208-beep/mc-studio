name: Single resident 20 minute REAL graphical daywatch
on:
  workflow_dispatch:
  pull_request:
    branches: [fix/npc-command-access-v066]
  push:
    branches: [test/npc-single-citizen-full-day-v067]
permissions:
  contents: read
jobs:
  watch-same-npc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install actual GUI / screenshots driver
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool imagemagick openbox
      - name: Open Minecraft, create world and keep ONE NPC on camera
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=15s 2100s \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            bash scripts/test-npc-single-day-gui.sh | tee daywatch-gui-action.log
          grep -F 'REME_DAYWATCH_GUI_RESULT' daywatch-gui-action.log
      - name: Archive all 24 actual game screenshots and source log, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-one-citizen-24-real-render-frames
          if-no-files-found: warn
          path: |
            daywatch-gui-action.log
            mod/daywatch-*.png
            mod/daywatch-client-boot.log
            mod/run/logs/*.log
            mod/runs/**/logs/*.log

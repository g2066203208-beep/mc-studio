concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

name: Server GameTests (experimental)
on:
  workflow_dispatch:
  push:
    branches: [feature/living-world-civic-v04, feature/living-world-natural-v05, feature/npc-resource-pickup-v058, feature/npc-emergent-roads-hamlets-v059, feature/npc-animation-art-pipeline-v060, feature/npc-real-player-actor-v061, feature/npc-local-justice-v062, feature/npc-physical-shopkeepers-v063, feature/npc-physical-workplaces-v064, fix/npc-v064-reliable-workplaces, feature/npc-mutual-aid-longrun-v065, fix/npc-command-access-v066, fix/npc-city-entrance-bed-claims-v083, fix/npc-jail-rear-intake-physical-waypoints-v084, fix/npc-real-home-door-approach-v085, fix/npc-long-range-physical-custody-v086, fix/npc-visible-collision-safe-follow-camera-v087, fix/npc-police-station-physical-detour-v088, fix/npc-escorted-custody-proximity-v089]
  pull_request:
permissions:
  contents: read
jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare separate 48x24x48 GameTest structures (do not modify user saves)
        run: python3 scripts/prepare-gametest-arena.py
      - name: Run Minecraft 1.21.1 NeoForge GameTest server
        working-directory: mod
        run: ./gradlew runGameTestServer --no-daemon --stacktrace
      - name: Upload game-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-server-logs
          path: |
            mod/runs/**/logs/*.log
            mod/run/**/logs/*.log
          if-no-files-found: ignore

name: Inspect authorized free community skin sources
on:
  push:
    branches: [feature/npc-character-skins-v055]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download artist packs and verify PNG files
        shell: bash
        run: |
          set -u
          mkdir -p skin-research
          curl -L --retry 2 --max-time 45 -f -o skin-research/artist_CC4.mcpack 'https://mediafilez.forgecdn.net/files/7685/079/ThatOneSillyGuy_Pack_V2.mcpack' || true
          curl -L --retry 2 --max-time 45 -f -o skin-research/ross_casual.png 'https://raw.githubusercontent.com/raws/minecraft-skins/master/casual.png' || true
          curl -L --retry 2 --max-time 45 -f -o skin-research/ross_indy.png 'https://raw.githubusercontent.com/raws/minecraft-skins/master/indy.png' || true
          curl -L --retry 2 --max-time 45 -f -o skin-research/ross_tuxedo.png 'https://raw.githubusercontent.com/raws/minecraft-skins/master/tuxedo.png' || true
          file skin-research/* || true
          python3 - <<'PY'
          import zipfile,os,struct
          root="skin-research"
          for name in os.listdir(root):
              p=os.path.join(root,name)
              try:
                  if zipfile.is_zipfile(p):
                      z=zipfile.ZipFile(p)
                      for f in z.namelist():
                          if f.lower().endswith(".png"):
                              b=z.read(f)
                              dim=struct.unpack(">II",b[16:24]) if b[:8]==b"\x89PNG\r\n\x1a\n" else None
                              print("PACK",f, len(b),dim)
                  elif name.endswith(".png"):
                      b=open(p,"rb").read()
                      print("SKIN",name,len(b),struct.unpack(">II",b[16:24]) if b[:8]==b"\x89PNG\r\n\x1a\n" else None)
              except Exception as e:print(type(e).__name__,str(e))
          PY
      - name: Archive original source assets for inspection (do not auto-redistribute)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-free-skins-research
          path: skin-research/*
          if-no-files-found: ignore

name: WorldSeam Real Sable Aeronautics Integration
on:
  pull_request:
    paths:
      - "mods/worldseam/**"
      - ".github/workflows/worldseam-sable-real-mods.yml"
  workflow_dispatch:

# Do not test obsolete commits while the current PR keeps evolving.
concurrency:
  group: worldseam-real-mods-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actual-sable-aeronautics-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # These are real off-the-shelf Modrinth jars, not stub APIs or
      # source copied from restricted-license third-party projects.
      - name: Download pinned released Sable 2.0.6, Create 6.0.10, Aeronautics 1.3.2
        working-directory: mods/worldseam
        run: |
          set -euo pipefail
          python ci/install_real_mods.py run/mods | tee real-release-download.log
          test -s real-mod-versions.json
          test "$(find run/mods -maxdepth 1 -name '*.jar' | wc -l)" -ge 3
          echo "Real signed-hash-verified third-party jars (not uploaded as artifacts):"
          cat real-mod-versions.json

      - name: Run real NeoForge 1.21.1 GameTests with those exact released mods
        shell: bash
        working-directory: mods/worldseam
        run: |
          set -euo pipefail
          bash ./gradlew runGameTestServer -PworldseamRequireExternalMods \
            --no-daemon --console=plain 2>&1 | tee real-sable-gametest.log
          if ! grep -q 'WORLDSEAM_REAL_EXTERNAL_MODS_PASS' real-sable-gametest.log; then
            echo 'Failed: true released Sable/Create/Aeronautics compatibility test did not run'
            exit 1
          fi
          if ! grep -q 'WORLDSEAM_SABLE_PROBE_READY' real-sable-gametest.log; then
            echo 'Failed: Sable real sublevel reflection API not verified'
            exit 1
          fi
          if ! grep -q 'WORLDSEAM_REAL_SABLE_SHIP_ASSEMBLED' real-sable-gametest.log ||
             ! grep -q 'WORLDSEAM_REAL_SABLE_STRADDLE_OBSERVED' real-sable-gametest.log; then
            echo 'Failed: never physically assembled a genuine Sable sublevel or observed its moving hull touching the join'
            exit 1
          fi
          # A static but straddling hull is NOT an aircraft: this MUST come
          # from live Sable 2.0.6 native Rapier after position has changed.
          if ! grep -q 'WORLDSEAM_REAL_SABLE_NATIVE_FORCE_MOVEMENT_PASS' real-sable-gametest.log; then
            echo 'Failed: no real Sable UUID ever moved under mass-scaled native Rapier Newton force'
            exit 1
          fi
          echo 'WorldSeam real released-mod GameTest assembled and observed an actual Sable hull crossing the seam. Native dual-chart Rapier contacts still NOT implemented.'

      - name: Publish logs and version hashes, never redistribute third-party jars
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldseam-released-sable-create-aeronautics-logs
          path: |
            mods/worldseam/real-mod-versions.json
            mods/worldseam/real-release-download.log
            mods/worldseam/real-sable-gametest.log
            mods/worldseam/run/logs/latest.log
          if-no-files-found: ignore

name: NPC single resident full-day observation
on:
  workflow_dispatch:
  pull_request:
    branches: [fix/npc-command-access-v066]
  push:
    branches: [test/npc-single-citizen-full-day-v067]
permissions:
  contents: read

jobs:
  watch-one-day:
    name: DayWatch real farmer — ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: fast-24000-ticks
            wall_seconds: 0
          - kind: real-20-minute-watch
            wall_seconds: 1200
    env:
      JAVA_TOOL_OPTIONS: "-Dreme.npc.singleDay=true -Dreme.npc.singleDay.minWallSeconds=${{ matrix.wall_seconds }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare isolated 48x24x48 Minecraft GameTest area
        run: python3 scripts/prepare-gametest-arena.py
      - name: Observe EXACT SAME UUID across all 24 Minecraft hours
        working-directory: mod
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew runGameTestServer --no-daemon --stacktrace 2>&1 | tee "daywatch-${{ matrix.kind }}.log"
          grep -F 'REME_DAYWATCH_BEGIN' "daywatch-${{ matrix.kind }}.log"
          grep -F 'REME_DAYWATCH_RESULT' "daywatch-${{ matrix.kind }}.log"
          grep -E 'All [0-9]+ required tests passed' "daywatch-${{ matrix.kind }}.log"
          # 24 hourly records from the exact same observed UUID are mandatory.
          count=$(grep -c '^REME_DAYWATCH_HOUR hour=' "daywatch-${{ matrix.kind }}.log" || true)
          echo "Observed unique-hour log count: $count"
          test "$count" -eq 24
          # In real-wall-clock mode, the server must satisfy >=20 true minutes.
          if [ "${{ matrix.wall_seconds }}" -gt 0 ]; then
            grep -E 'REME_DAYWATCH_RESULT.*realSeconds=1[2-9][0-9][0-9]\.' "daywatch-${{ matrix.kind }}.log"
          fi
      - name: Upload full, timestamped day watch — even when failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-farmer-${{ matrix.kind }}-24-hour-evidence
          if-no-files-found: warn
          path: |
            mod/daywatch-${{ matrix.kind }}.log
            mod/run/logs/*.log
            mod/runs/**/logs/*.log

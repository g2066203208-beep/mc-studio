concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

name: NPC city REAL NeoForge visual screenshot E2E
on:
  workflow_dispatch:
  push:
    branches:
      - feat/npc-real-city-district-v070
      - feat/npc-live-store-security-e2e-v071
      - feat/npc-daily-routines-housing-v072
      - fix/npc-city-entrance-bed-claims-v083
      - fix/npc-jail-rear-intake-physical-waypoints-v084
      - fix/npc-real-home-door-approach-v085
      - fix/npc-long-range-physical-custody-v086
      - fix/npc-visible-collision-safe-follow-camera-v087
      - fix/npc-police-station-physical-detour-v088
      - fix/npc-escorted-custody-proximity-v089
      - fix/npc-unloaded-jail-custody-v090
      - fix/npc-gui-apt-timeout-evidence-v091
      - fix/npc-gui-install-cache-first-v092
      - fix/npc-playeranimator-resource-registry-v093
      - fix/npc-gui-runner-apt-visibility-v094
      - test/npc-escort-cell-arrival-no-floor-fall-v095
      - test/npc-real-client-video-integrity-v096
      - fix/npc-gui-apt-dpkg-lock-v097
      - feat/npc-physical-escort-pair-camera-v098
      - fix/npc-camera-spectator-body-clearance-v099
      - fix/npc-gui-cold-apt-install-budget-v100
      - fix/npc-camera-partial-block-clearance-v101
      - fix/npc-escort-pair-elevated-clear-lens-v102
      - fix/npc-iron-jail-door-half-integrity-v103
      - fix/npc-custody-close-escort-leash-v104
      - fix/npc-unloaded-prisoner-escort-resume-v105
      - test/npc-escort-entity-reappear-v106
      - test/npc-full-day-store-conservation-v107
      - fix/npc-cross-dimension-trade-guard-v108
      - fix/npc-home-door-inside-stage-v109
      - fix/npc-cell-arrival-officer-four-block-v110
      - fix/npc-camera-low-vantage-first-v111
      - fix/npc-camera-narrow-side-angles-v112
  pull_request:
    branches:
      - feat/npc-economy-market-fair-v069

permissions:
  contents: read

jobs:
  city-client-visual:
    # The 24.04.5 image repeatedly timed out in apt before Minecraft launched.
    # Pin the independently maintained 22.04 runner to isolate mirror/image
    # regressions; this does not waive actual-client video acceptance.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify real Minecraft NeoForge and city release
        shell: bash
        run: |
          grep -Fxq 'minecraft_version=1.21.1' mod/gradle.properties
          grep -Fxq 'neo_version=21.1.262' mod/gradle.properties
          grep -Fxq 'mod_version=0.7.2-dev' mod/gradle.properties
      - name: Verify shared NPC and real-player keyframe assets
        run: python3 scripts/check-npc-animation-assets.py
      - name: Verify recorded same-UUID crime-window regression tests
        run: python3 scripts/test-verify-npc-gui-case.py
      - name: Install GUI dependencies without overlapping apt or dpkg processes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Runner: $(lsb_release -ds 2>/dev/null || uname -a)"
            echo "APT source configuration (diagnostics only):"
            grep -rhE "^(URIs:|Suites:|deb )" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
            echo "Package candidates:"
            apt-cache policy xdotool imagemagick openbox ffmpeg | head -n 75 || true
            echo "Checking the actual GUI commands before attempting network apt update"
            required=(xvfb-run xdotool import openbox ffmpeg ffprobe)
            missing=()
            for binary in "${required[@]}"; do
              if command -v "$binary" >/dev/null 2>&1; then
                echo "PRESENT $binary: $(command -v "$binary")"
              else
                echo "MISSING $binary"
                missing+=("$binary")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              echo "Install missing dependencies using the runner's existing apt indexes first"
              packages=(xvfb xdotool imagemagick openbox ffmpeg)
              # Previous 150s timeout killed the shell wrapper while apt-get
              # continued unpacking in the background. The immediate retry then
              # collided with the still-held dpkg frontend lock (exit 100).
              # Give a cold runner time to install all dependencies and NEVER
              # start a second apt process after a timed-out install.
              # On PR #137, apt had already unpacked all packages and was
              # running libc-bin post-install when the 420s deadline killed it.
              # Extend the cold-install budget without changing required tools
              # or allowing a second concurrent apt/dpkg invocation.
              if sudo timeout --signal=TERM --kill-after=30s 720s \
                  env DEBIAN_FRONTEND=noninteractive apt-get \
                    -o Acquire::Retries=0 -o Acquire::http::Timeout=20 \
                    -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60 \
                    install -y --no-install-recommends "${packages[@]}"; then
                echo "GUI_APT_INSTALL_COMPLETED"
              else
                status=$?
                echo "GUI_APT_INSTALL_FAILED exit=${status}; refusing unsafe concurrent apt retry"
                ps -eo pid,ppid,stat,etime,args | grep -E '[a]pt-get|[d]pkg|[t]imeout' || true
                exit "${status}"
              fi
            else
              echo "ALL_GUI_TOOLS_ALREADY_PRESENT; skipping apt network calls"
            fi
            for binary in "${required[@]}"; do
              command -v "$binary" || { echo "GUI_DEPENDENCY_MISSING_AFTER_INSTALL=$binary"; exit 1; }
            done
            echo "GUI_DEPENDENCIES_READY; actual Minecraft client must still run and be verified"
          } 2>&1 | tee npc-city-gui-dependencies.log
      - name: Actually enter Minecraft and build/photograph city
        shell: bash
        env:
          REME_CITY_VISUAL: '1'
          REME_COMMAND_SMOKE_ONLY: '0'
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=15s 1000s \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            bash scripts/test-client-gui.sh
      - name: Reject missing or frozen native MP4, bad screenshots and animation resource warnings
        shell: bash
        run: |
          python3 scripts/verify-npc-client-capture.py --self-test
          python3 scripts/verify-npc-client-capture.py --root mod
      - name: ALWAYS upload actual RGB screenshots and Minecraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-real-city-1-21-1-neoforge-3d-screenshots
          if-no-files-found: warn
          path: |
            mod/client-gui-city-*.png
            mod/client-gui-city-*.mp4
            mod/client-gui-npc-*.png
            mod/client-gui.log
            mod/client-gui-city-*.log
            npc-city-gui-dependencies.log
            mod/run/logs/*.log
            mod/runs/**/logs/*.log

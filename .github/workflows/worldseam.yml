name: WorldSeam Independent Mod
# Only newest PR SHA should consume scarce graphical/Minecraft runners.
# In-flight obsolete builds are cancelled on a new commit rather than
# creating dozens of misleading old screenshots and hour-long queues.
concurrency:
  group: worldseam-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/worldseam-standalone]
    paths: ["mods/worldseam/**", ".github/workflows/worldseam.yml"]
  pull_request:
    paths: ["mods/worldseam/**", ".github/workflows/worldseam.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-worldseam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build isolated WorldSeam jar
        working-directory: mods/worldseam
        run: bash ./gradlew clean test build --no-daemon --console=plain
      - name: Assert unique Mod ID and no climbing classes
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find mods/worldseam/build/libs -maxdepth 1 -name 'worldseam-*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$jar_path"
          unzip -p "$jar_path" META-INF/neoforge.mods.toml | grep -q 'modId="worldseam"'
          jar tf "$jar_path" | grep -q 'dev/reme/worldseam/WorldSeamMod.class'
          if jar tf "$jar_path" | grep -E '(^dev/reme/mcstudio/|/climb/|/peak/)'; then
            echo 'Climbing or studio classes leaked into WorldSeam jar'
            exit 1
          fi
          echo "WorldSeam package separation passed"
          sha256sum "$jar_path"
      - uses: actions/upload-artifact@v4
        with:
          name: worldseam-only-${{ github.sha }}
          path: mods/worldseam/build/libs/worldseam-*.jar
          if-no-files-found: error
  gametest-worldseam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual WorldSeam GameTest server
        working-directory: mods/worldseam
        run: bash ./gradlew runGameTestServer --no-daemon --console=plain

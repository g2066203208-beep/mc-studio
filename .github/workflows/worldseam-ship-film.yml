name: WorldSeam Genuine Sable Ship Flight Video
on:
  push:
    branches: [feat/worldseam-continuous-seam-p2]
    paths:
      - "mods/worldseam/**"
      - ".github/workflows/worldseam-ship-film.yml"
  pull_request:
    paths:
      - "mods/worldseam/**"
      - ".github/workflows/worldseam-ship-film.yml"
  workflow_dispatch:

# Only film the latest PR revision.
concurrency:
  group: worldseam-genuine-ship-film-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  real-minecraft-video:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal real X11 display and pinned ffmpeg encoder
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Previous run 39925099966 failed BEFORE launching Minecraft:
          # a 65 MB apt ffmpeg+ImageMagick chain timed out on Azure mirror.
          # Use apt only for the tiny X11 server/input tools, and the pinned
          # imageio-ffmpeg binary for genuine continuous x11grab MP4 frames.
          timeout 180 sudo apt-get -o Acquire::Retries=0 update -qq
          timeout 180 sudo apt-get -o Acquire::Retries=0 -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends xvfb xdotool libgl1-mesa-dri libglx-mesa0
          python -m pip install --disable-pip-version-check --no-input imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/worldseam-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" \
            "$RUNNER_TEMP/worldseam-bin/ffmpeg"
          export PATH="$RUNNER_TEMP/worldseam-bin:$PATH"
          echo "$RUNNER_TEMP/worldseam-bin" >> "$GITHUB_PATH"
          for cmd in Xvfb xvfb-run xdotool ffmpeg; do
            command -v "$cmd" >/dev/null || { echo "WORLDSEAM_FILM_MISSING: $cmd"; exit 1; }
          done
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264 >/dev/null ||
            { echo 'WORLDSEAM_FILM_MISSING_NATIVE_H264_ENCODER'; exit 1; }
          ffmpeg -hide_banner -devices 2>/dev/null | grep x11grab >/dev/null ||
            { echo 'WORLDSEAM_FILM_MISSING_REAL_X11_CAPTURE'; exit 1; }
          echo WORLDSEAM_FILM_NATIVE_CAPTURE_DEPS_READY
      - name: Fetch actual released Sable + Create + Aeronautics + required mods
        working-directory: mods/worldseam
        run: |
          set -euo pipefail
          python ci/install_real_mods.py run/mods | tee real-ship-release-versions.log
          test -s real-mod-versions.json
          test "$(find run/mods -maxdepth 1 -name '*.jar' | wc -l)" -ge 3
      - name: Record real aircraft in disposable Minecraft world; vanilla /fill air on both sides
        shell: bash
        working-directory: mods/worldseam
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash ci/record_real_sable_ship.sh
      - name: Upload RAW MP4 plus same-run game log and real Sable UUID/coordinates EVEN ON FAILURE
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldseam-real-sable-aircraft-video-and-logs
          retention-days: 20
          path: |
            mods/worldseam/real-ship-*mp4
            mods/worldseam/real-ship-film-client.log
            mods/worldseam/real-ship-flight-telemetry.log
            mods/worldseam/real-ship-ffmpeg.log
            mods/worldseam/real-ship-jvm-thread-dump.txt
            mods/worldseam/real-ship-*.jpg
            mods/worldseam/real-ship-release-versions.log
            mods/worldseam/real-mod-versions.json
            mods/worldseam/run/logs/latest.log
          if-no-files-found: ignore

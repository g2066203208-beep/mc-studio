name: WorldSeam Genuine Sable Ship Flight Video
on:
  pull_request:
    paths:
      - "mods/worldseam/**"
      - ".github/workflows/worldseam-ship-film.yml"
  workflow_dispatch:

# Only film the latest PR revision.
concurrency:
  group: worldseam-genuine-ship-film-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  real-minecraft-video:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Minecraft X11 GPU renderer and native MP4 screen recorder
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Always preserve a bounded failure log: apt mirrors can stall
          # indefinitely on an otherwise healthy GitHub runner. All five
          # real X11/ffmpeg dependencies are necessary, not screenshots.
          if command -v Xvfb >/dev/null && command -v xdotool >/dev/null &&
             command -v ffmpeg >/dev/null && command -v convert >/dev/null &&
             command -v xwd >/dev/null; then
            echo "WORLDSEAM_FILM_X11_PACKAGES_ALREADY_PRESENT"
          else
            echo "WORLDSEAM_FILM_INSTALL_START"
            timeout 180 sudo apt-get -o Acquire::Retries=2 update -qq
            timeout 240 sudo apt-get -o Dpkg::Use-Pty=0 install -y --no-install-recommends \
              xvfb libgl1-mesa-dri libglx-mesa0 xdotool ffmpeg imagemagick x11-apps
          fi
          for cmd in Xvfb xdotool ffmpeg convert xwd; do
            command -v "$cmd" >/dev/null || {
              echo "WORLDSEAM_FILM_X11_DEPENDENCY_MISSING: $cmd"
              exit 1
            }
          done
      - name: Fetch actual released Sable + Create + Aeronautics + required mods
        working-directory: mods/worldseam
        run: |
          set -euo pipefail
          python ci/install_real_mods.py run/mods | tee real-ship-release-versions.log
          test -s real-mod-versions.json
          test "$(find run/mods -maxdepth 1 -name '*.jar' | wc -l)" -ge 3
      - name: Record real aircraft in disposable Minecraft world; vanilla /fill air on both sides
        shell: bash
        working-directory: mods/worldseam
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash ci/record_real_sable_ship.sh
      - name: Upload RAW MP4 plus same-run game log and real Sable UUID/coordinates EVEN ON FAILURE
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldseam-real-sable-aircraft-video-and-logs
          retention-days: 20
          path: |
            mods/worldseam/real-ship-*mp4
            mods/worldseam/real-ship-film-client.log
            mods/worldseam/real-ship-flight-telemetry.log
            mods/worldseam/real-ship-ffmpeg.log
            mods/worldseam/real-ship-jvm-thread-dump.txt
            mods/worldseam/real-ship-*.jpg
            mods/worldseam/real-ship-release-versions.log
            mods/worldseam/real-mod-versions.json
            mods/worldseam/run/logs/latest.log
          if-no-files-found: ignore

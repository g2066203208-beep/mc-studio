name: Deploy MC Studio 3D Model Viewer
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-model-viewer"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout viewer
        uses: actions/checkout@v4
      - name: Validate interactive 3D viewer JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          page=Path('viewer/index.html').read_text(encoding='utf-8')
          match=re.search(r'<script type="module">([\s\S]*?)</script>',page)
          assert match, 'No module script in viewer/index.html'
          Path('/tmp/mts-viewer-check.mjs').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/mts-viewer-check.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static viewer website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./viewer
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

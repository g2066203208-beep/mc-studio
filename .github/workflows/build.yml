name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One build per task branch: later pushes replace superseded CI runs.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reme-studio-${{ github.sha }}
          path: mod/build/libs/*.jar
          if-no-files-found: error

      - name: Save unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: mod/build/test-results/test/*.xml
          if-no-files-found: ignore

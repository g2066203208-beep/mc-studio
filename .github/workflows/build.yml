name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test living-world planner core
        run: bash scripts/test-living-planner.sh
      - name: Validate six human skin assets
        run: python3 scripts/check-npc-skins.py
      - name: Audit real 64x64 outer-layer alpha and expose incomplete art
        run: python3 scripts/audit-npc-skin-layers.py
        # Non-blocking until skins are actually redrawn; human QA knows which
        # characters fail. Release gate later runs with --strict.
      - name: Build
        run: bash scripts/build.sh
      - name: Assert skins packaged in NeoForge JAR
        run: python3 scripts/check-npc-skins.py
      - name: Resolve exact mod version from Gradle property
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' mod/gradle.properties | tail -n 1)"
          test -n "$VERSION"
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify installer source and mod metadata
        run: python3 scripts/test-installer.py "mod/build/libs/reme_studio-${MOD_VERSION}.jar"
      - name: Package Windows HMCL one-click installer
        run: |
          folder="dist/REME-NPC-HMCL-${MOD_VERSION}"
          mkdir -p "$folder"
          cp "mod/build/libs/reme_studio-${MOD_VERSION}.jar" "$folder/"
          cp packaging/Install-REME-NPC.cmd packaging/Install-REME-NPC.ps1 "$folder/"
          cp docs/NPC_HMCL_ACCEPTANCE.md "$folder/README.txt"
          (cd "$folder" && zip -q -9 "../REME-NPC-HMCL-${MOD_VERSION}-installer.zip" ./*)
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ env.MOD_VERSION }}
          path: dist/REME-NPC-HMCL-${{ env.MOD_VERSION }}-installer.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reme-studio-${{ github.sha }}
          path: mod/build/libs/*.jar
          if-no-files-found: error

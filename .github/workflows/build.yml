name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One build per task branch: later pushes replace superseded CI runs.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reme-studio-${{ github.sha }}
          path: mod/build/libs/*.jar
          if-no-files-found: error

      - name: Save unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: mod/build/test-results/test/*.xml
          if-no-files-found: ignore

  gametest:
    name: Minecraft GameTest (headless)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute in-engine surface tests
        working-directory: mod
        run: bash ./gradlew runGameTestServer --no-daemon --console=plain
      - name: Upload GameTest diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ github.sha }}
          path: |
            mod/run/logs/*.log
            mod/run-gameTestServer/logs/*.log
          if-no-files-found: ignore

  sable-integration:
    name: Sable 2.0.6 integration startup
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual Sable physics mod in GameTest server
        working-directory: mod
        run: bash ./gradlew runGameTestServer -PwithSable --no-daemon --console=plain
      - name: Save Sable startup and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-integration-logs-${{ github.sha }}
          path: mod/run/logs/*.log
          if-no-files-found: ignore


  client-smoke:
    name: Minecraft graphical client smoke (Xvfb)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install virtual display and Mesa software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Launch graphical Minecraft client with Sable
        working-directory: mod
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          timeout --signal=INT --kill-after=10s 240s \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            bash ./gradlew runClient -PwithSable --no-daemon --console=plain \
            > ../client-smoke.log 2>&1
          result=$?
          set -e
          echo "Client exit status: $result (124 = intentionally timed out after startup)"
          grep -Ei 'OpenGL|resource.?manager|GameRenderer|Minecraft.*initialized|Sound engine|GLFW|mixin|fatal|exception' ../client-smoke.log | tail -35 || true
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            echo "Minecraft client exited unexpectedly"
            exit 1
          fi
          if ! grep -Eiq 'OpenGL|Reloading ResourceManager|Sound engine started|Created.*window' ../client-smoke.log; then
            echo "No evidence the graphical client initialized successfully"
            exit 1
          fi
          # Sable/Veil may probe optional Iris integrations and log harmless
          # ClassNotFoundException for an absent optional shader mod. Do not
          # flag that as a crash; require an actual Mixin or linkage failure.
          if grep -Eq 'MixinApplyError|MixinTransformerError|NoSuchMethodError|ClassNotFoundException: dev[./]reme' ../client-smoke.log; then
            echo "Client renderer/mixin linkage failure"
            exit 1
          fi
      - name: Save graphical startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-logs-GITHUBSHA
          path: |
            client-smoke.log
            mod/run/logs/*.log
            mod/run-client/logs/*.log
          if-no-files-found: ignore

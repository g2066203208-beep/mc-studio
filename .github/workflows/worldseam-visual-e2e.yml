name: WorldSeam Real Client Visual Evidence
on:
  push:
    branches: [feat/worldseam-standalone]
    paths:
      - "mods/worldseam/src/**"
      - "mods/worldseam/build.gradle"
      - "mods/worldseam/gradle.properties"
      - ".github/workflows/worldseam-visual-e2e.yml"
  pull_request:
    paths:
      - "mods/worldseam/src/**"
      - "mods/worldseam/build.gradle"
      - "mods/worldseam/gradle.properties"
      - ".github/workflows/worldseam-visual-e2e.yml"
  workflow_dispatch:
permissions:
  # Push *verified real NeoForge screenshots* only after the GUI E2E passes.
  contents: write
jobs:
  visual-client:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install actual GUI software renderer and screenshot utilities
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 xdotool imagemagick x11-apps
      - name: Open actual Minecraft graphical client and capture display
        shell: bash
        working-directory: mods/worldseam
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -euo pipefail
            export LIBGL_ALWAYS_SOFTWARE=1
            bash ./gradlew runClient -PworldseamE2E -PworldseamGpuSections --no-daemon --console=plain > visual-client.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for step in $(seq 1 170); do
              if grep -q "Reloading ResourceManager" visual-client.log; then break; fi
              if ! kill -0 $pid 2>/dev/null; then
                tail -n 70 visual-client.log
                exit 1
              fi
              sleep 1
            done
            sleep 22
            echo "Minecraft GUI windows:"
            xdotool search --name Minecraft getwindowname 2>/dev/null || true
            xwd -root -silent | convert xwd:- -resize 600x338 -quality 48 visual-dialog.jpg
            # Minecraft first-launch accessibility welcome screen blocks all menus.
            xdotool mousemove 640 568 click 1
            sleep 8
            xwd -root -silent | convert xwd:- -resize 600x338 -quality 48 visual-mainmenu.jpg
            xdotool mousemove 640 336 click 1
            sleep 8
            xwd -root -silent | convert xwd:- -resize 600x338 -quality 48 visual-world-select.jpg
            xdotool mousemove 640 540 click 1
            sleep 8
            xwd -root -silent | convert xwd:- -resize 600x338 -quality 48 visual-world-create.jpg
            # Open the native WorldSeam Create World editor at upper-right.
            # This UI verification runs before any world is created.
            xdotool mousemove 640 480 click 1
            sleep 3
            xwd -root -silent | convert xwd:- -resize 800x450 -quality 65 visual-stack-editor.jpg
            if ! grep -q "WORLDSEAM_CREATE_STACK_UI_OPEN.*minecraft:overworld > minecraft:the_nether > minecraft:the_end" visual-client.log; then
              echo "WorldSeam default stack GUI does not show Overworld > Nether > End"
              tail -n 50 visual-client.log
              exit 1
            fi
            xdotool key Escape
            sleep 3
            # The actual screenshot shows Allow Commands at GUI x640 y403.
            # Enable commands and create a fresh DISPOSABLE survival world.
            xdotool mousemove 640 403 click 1
            sleep 2
            xdotool mousemove 480 565 click 1
            # Wait for REAL INTEGRATED SERVER E2E stage markers instead of
            # guessing fixed GUI-load times. The first frame MUST be in the
            # OVERWORLD, looking through Y=-64 into the Nether visual markers.
            found=0
            for step in $(seq 1 180); do
              if grep -q "WORLDSEAM_E2E_PREVIEW_WINDOW" visual-client.log; then found=1; break; fi
              if grep -q "WORLDSEAM_E2E_FAIL" visual-client.log; then break; fi
              sleep 1
            done
            if [ "$found" != 1 ]; then
              echo "WorldSeam NEVER reached pre-crossing visual evidence stage"; tail -n 60 visual-client.log; exit 1
            fi
            xwd -root -silent | convert xwd:- -resize 800x450 -quality 58 visual-in-world.jpg
            echo "WORLDSEAM_CAPTURED_PRE_CROSSING_OVERWORLD"
            found=0
            for step in $(seq 1 90); do
              if grep -q "WORLDSEAM_E2E_REVERSE_STAGE" visual-client.log; then found=1; break; fi
              sleep 1
            done
            if [ "$found" != 1 ]; then
              echo "WorldSeam NEVER entered Nether"; tail -n 50 visual-client.log; exit 1
            fi
            sleep 2
            xwd -root -silent | convert xwd:- -resize 800x450 -quality 58 visual-near-seam.jpg
            echo "WORLDSEAM_CAPTURED_NETHER_LOOKING_UP"
            # Wait for a real PrimedTnt entity in Nether to explode and
            # destroy a GLASS block owned by Overworld Y=-64.
            blast=0
            for step in $(seq 1 130); do
              if grep -q "WORLDSEAM_E2E_PASS_CROSS_TNT" visual-client.log; then blast=1; break; fi
              if grep -q "WORLDSEAM_E2E_FAIL_CROSS_TNT" visual-client.log; then break; fi
              sleep 1
            done
            if [ "$blast" != 1 ]; then
              echo "WORLDSEAM_REAL_TNT_FAIL: remote explosion did not destroy Overworld floor"
              tail -n 90 visual-client.log
              exit 1
            fi
            xwd -root -silent | convert xwd:- -resize 800x450 -quality 64 visual-cross-tnt.jpg
            found=0
            for step in $(seq 1 80); do
              if grep -q "WORLDSEAM_E2E_PASS_RETURN_CLIENT" visual-client.log; then found=1; break; fi
              sleep 1
            done
            xwd -root -silent | convert xwd:- -resize 800x450 -quality 58 visual-crossing.jpg
            # At Overworld TOP before crossing, capture actual End underside.
            found=0
            for step in $(seq 1 220); do
              if grep -q "WORLDSEAM_E2E_END_PREVIEW_WINDOW" visual-client.log; then found=1; break; fi
              if grep -q "WORLDSEAM_E2E_FAIL" visual-client.log; then break; fi
              sleep 1
            done
            if [ "$found" != 1 ]; then
              echo "End preview stage never reached"; tail -n 45 visual-client.log; exit 1
            fi
            xwd -root -silent | convert xwd:- -resize 800x450 -quality 58 visual-end-before-cross.jpg
            found=0
            for step in $(seq 1 220); do
              if grep -q "WORLDSEAM_E2E_PASS_END_CLIENT" visual-client.log; then found=1; break; fi
              if grep -q "WORLDSEAM_E2E_FAIL_END" visual-client.log; then break; fi
              sleep 1
            done
            xwd -root -silent | convert xwd:- -resize 800x450 -quality 58 visual-end-after-cross.jpg
            # Actually turn OFF WorldSeam in the live integrated server;
            # the client must release its secondary ClientLevel immediately,
            # rather than retaining a stale world after our idle-TTL fix.
            cleared=0
            for step in $(seq 1 110); do
              if grep -q "WORLDSEAM_E2E_PASS_DISABLE_CLEARED" visual-client.log; then cleared=1; break; fi
              if grep -q "WORLDSEAM_E2E_FAIL_DISABLE" visual-client.log; then break; fi
              sleep 1
            done
            if [ "$cleared" != 1 ]; then
              echo "WORLDSEAM_GUI_FAIL: disabling mod left stale client remote world"
              tail -n 75 visual-client.log
              exit 1
            fi
            montage visual-in-world.jpg visual-near-seam.jpg visual-cross-tnt.jpg visual-crossing.jpg visual-end-before-cross.jpg visual-end-after-cross.jpg visual-stack-editor.jpg -tile 4x2 -geometry +0+0 -quality 55 visual-sequence.jpg
            echo WORLDSEAM_GUI_JPEG_BEGIN
            base64 -w 0 visual-sequence.jpg
            echo
            echo WORLDSEAM_GUI_JPEG_END
            if ! grep -q "WorldSeam standalone mod loaded" visual-client.log; then
              echo "Mod never loaded in graphical client!"
              exit 1
            fi
            echo "=== WORLDSEAM ACTUAL INTEGRATED CLIENT E2E LOG ==="
            grep -E "WORLDSEAM_E2E_|WorldSeam prewarmed|WorldSeam direct local ClientLevel switch" visual-client.log | tail -n 50 || true
            if grep -q "WORLDSEAM_E2E_FAIL" visual-client.log; then
              echo "WorldSeam integrated E2E failed"; exit 1
            fi
            # Historical saved worlds must retain the old order after an
            # upgrade; the existing Overworld→End test runs in that explicitly
            # pinned regression fixture. New-world GUI defaults are checked
            # independently above.
            if ! grep -q "WORLDSEAM_E2E_LEGACY_STACK_PINNED" visual-client.log; then
              echo "Historical saved-order E2E was not explicitly configured"
              exit 1
            fi
            if ! grep -q "WORLDSEAM_E2E_PASS_CLIENT" visual-client.log ||
               ! grep -q "WORLDSEAM_E2E_PASS_SERVER" visual-client.log ||
               ! grep -q "WORLDSEAM_E2E_PASS_RETURN_CLIENT" visual-client.log ||
               ! grep -q "WORLDSEAM_E2E_PASS_RETURN_SERVER" visual-client.log ||
               ! grep -q "WORLDSEAM_E2E_PASS_END_CLIENT" visual-client.log ||
               ! grep -q "WORLDSEAM_E2E_PASS_END_SERVER" visual-client.log; then
              echo "WorldSeam never proved BOTH actual server and client dimension change"; exit 1
            fi
            echo "WorldSeam integrated E2E verified server and client dimension handoff"

            if grep -E "Mixin apply failed|InvalidMixinException|Exception during client tick|NoSuchMethodError" visual-client.log; then
              echo "WorldSeam failed in GUI client"
              exit 1
            fi
            echo "WorldSeam GUI captured and integrated two-way dimension checks passed; visual frame-level seamless composition still requires separate validation"
          '
      - name: Save full reproducible GUI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldseam-real-gui-evidence
          path: |
            mods/worldseam/visual-client.log
            mods/worldseam/visual-*.jpg
          if-no-files-found: ignore
      - name: Publish verified real Minecraft screenshots to WorldSeam evidence
        if: success() && github.ref == 'refs/heads/feat/worldseam-standalone'
        shell: bash
        run: |
          set -euo pipefail
          dest=mods/worldseam/docs/evidence/latest-neoforge
          mkdir -p "$dest"
          for name in visual-in-world.jpg visual-near-seam.jpg visual-cross-tnt.jpg visual-crossing.jpg visual-end-before-cross.jpg visual-end-after-cross.jpg visual-stack-editor.jpg visual-sequence.jpg; do
            test -s "mods/worldseam/$name"
            cp "mods/worldseam/$name" "$dest/$name"
          done
          {
            printf '# WorldSeam actual NeoForge client evidence\n\n'
            printf 'GitHub Actions: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Source commit: %s\n\n' "$GITHUB_SHA"
            printf 'Captured on: %s UTC\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'Screenshots: raw real Minecraft via Xvfb/XWD; **not** composited artist mockups.\n\n'
            printf 'New world Create-World editor uses Overworld > Nether > End; the in-world End-above-Overworld journey is an explicitly pinned historical-save regression.\n\n'
            printf 'The E2E checks native handoff and client state. It does **not** certify pixel-perfect seamless frame composition or FPS.\n\n'
            printf 'Minecraft E2E log markers:\n'
            grep -E 'WORLDSEAM_E2E_(PASS|DUAL_|SECOND_WORLD_LIVE_BLOCK|END_NATURAL|PREVIEW_WINDOW|CROSS_TNT_)' mods/worldseam/visual-client.log | tail -n 70 || true
            printf '\n'
          } > "$dest/summary.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m 'test(worldseam): publish genuine NeoForge GUI snapshots [skip ci]'
            git push origin HEAD:feat/worldseam-standalone
          fi
      - name: Publish unmistakably failed real client evidence
        if: failure() && github.ref == 'refs/heads/feat/worldseam-standalone'
        shell: bash
        run: |
          set -euo pipefail
          dest=mods/worldseam/docs/evidence/latest-neoforge
          mkdir -p "$dest"
          {
            printf '# WorldSeam FAILED graphical client run (NOT a successful screenshot)\n\n'
            printf 'Actions: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Source commit: %s\n\n' "$GITHUB_SHA"
            printf 'Time: %s UTC\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'Successful screenshots and summary.md were deliberately NOT overwritten.\n\n'
            printf 'Available WorldSeam client E2E events and last diagnostic errors:\n\n'
            if test -f mods/worldseam/visual-client.log; then
              grep -E 'WORLDSEAM_E2E_|WORLDSEAM_REAL_TNT_FAIL|WORLDSEAM_GUI_FAIL|Exception during client tick|Mixin apply failed|InvalidMixinException' mods/worldseam/visual-client.log | tail -n 100 || true
              printf '\nLast 25 client log lines:\n\n'
              tail -n 25 mods/worldseam/visual-client.log
            else
              printf 'No client log generated; failure happened before NeoForge launch.\n'
            fi
          } > "$dest/latest-failed.md"
          for name in visual-in-world.jpg visual-near-seam.jpg visual-cross-tnt.jpg visual-end-before-cross.jpg; do
            if test -s "mods/worldseam/$name"; then
              cp "mods/worldseam/$name" "$dest/failed-$name"
            else
              rm -f "$dest/failed-$name"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest/latest-failed.md" "$dest"/failed-*.jpg 2>/dev/null || git add "$dest/latest-failed.md"
          if ! git diff --cached --quiet; then
            git commit -m 'test(worldseam): record FAILED NeoForge visual run separately [skip ci]'
            git push origin HEAD:feat/worldseam-standalone
          fi

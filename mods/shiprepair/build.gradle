plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
version=mod_version
group=mod_group_id
base { archivesName=mod_id }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
repositories {
    exclusiveContent {
        forRepository { maven { url='https://maven.ryanhcode.dev/releases' } }
        filter { includeGroup('dev.ryanhcode.sable-companion') }
    }
    exclusiveContent {
        forRepository { maven { url='https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}
neoForge {
    version=project.neo_version
    parchment {
        mappingsVersion=project.parchment_mappings_version
        minecraftVersion=project.parchment_minecraft_version
    }
    runs {
        client { client() }
        gameTestServer {
            type='gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    // Sable's SubLevel implements classes from its separately published companion API.
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0')
    compileOnly('maven.modrinth:T9PomCSv:fg9dTRz9') { transitive=false }
    localRuntime('maven.modrinth:T9PomCSv:fg9dTRz9') { transitive=false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
var metadata=tasks.register('generateModMetadata',ProcessResources) {
    var vars=[minecraft_version_range:minecraft_version_range, neo_version:neo_version,
        loader_version_range:loader_version_range,mod_id:mod_id,mod_name:mod_name,
        mod_license:mod_license,mod_version:mod_version]
    inputs.properties vars
    expand vars
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
